services:
  api:
    image: workforceiq-api:1.0
    container_name: workforceiq-api-container
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  frontend:
    image: workforceiq-frontend:1.0
    container_name: workforceiq-frontend-container
    ports:
      - "8501:8501"
    environment:
      API_URL: http://api:8000/predict
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
